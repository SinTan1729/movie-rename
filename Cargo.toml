[package]
name = "movie-rename"
version = "2.4.3"
edition = "2024"
description = "A simple tool to rename movies, written in Rust."
documentation = "https://docs.rs/movie-rename"
readme = "README.md"
homepage = "https://github.com/SinTan1729/movie-rename"
repository = "https://github.com/SinTan1729/movie-rename"
license = "GPL-3.0"
keywords = ["media", "movie", "rename", "tmdb"]
categories = ["command-line-utilities"]
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.7", features = ["cargo"] }
inquire = "0.9.4"
load_file = "1.0.1"
tmdb-api = "0.9.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
torrent-name-parser = "0.12.1"

[build-dependencies]
clap = { version = "4.6.7", features = ["cargo"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"

[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "abort"
codegen-units = 1
